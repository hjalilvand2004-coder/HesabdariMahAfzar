ید، سند حسابداری دوطرفه به‌صورت خودکار صادر می‌شود.","هزینه‌های پرداخت‌نشده شرکت با دکمه «تسویه» و انتخاب بانک/صندوق پرداخت می‌شوند."],tips:["قبل از ثبت، از دکمه «بررسی تکراری» استفاده کنید تا هزینه‌ای با فاکتور و طرف حساب یکسان دوبار ثبت نشود.","برای هزینه‌های پرداخت‌شده توسط عضو نیازی به تسویه نیست؛ سیستم خودش اعتبار ایجاد می‌کند.","پیوست فاکتور و قرارداد (عکس یا PDF) را از بخش پیوست‌ها بارگذاری کنید تا در حسابرسی قابل استناد باشد."]},funding:{title:"تأمین مالی اعضا",about:"ایجاد مصوبه تأمین مالی: هرگاه شرکت به پول نیاز دارد (پوشش هزینه‌ها یا خرید دارایی)، مبلغ مورد نیاز در قالب یک مصوبه بین سهامداران بر اساس درصد سهام (یا روش توافقی) تقسیم می‌شود و برای هر عضو یک «تعهد» ایجاد می‌گردد.",steps:["دکمه «مصوبه جدید»: عنوان، مبلغ کل، روش تقسیم و اعضای مشارکت‌کننده را مشخص کنید.","روش تقسیم را انتخاب کنید: «متناسب با درصد سهام» (پیشنهادی)، «مساوی»، «درصدهای توافقی» یا «مبلغ ثابت هر عضو».","پیش‌نمایش تقسیم را بررسی کنید؛ گرد کردن ریالی به‌صورت خودکار منصفانه انجام می‌شود.","مصوبه را «ارسال برای تأیید» کنید؛ پس از تأیید مدیرعامل، تعهد هر عضو قطعی می‌شود.","پرداخت اعضا به این تعهدات از بخش «پرداخت‌ها و وصول» ثبت و تخصیص می‌یابد."],tips:["مبنای درصد سهام، تاریخ «مبنای محاسبه» در فرم است؛ اگر سهام عضو در آن تاریخ متفاوت بوده، سهم تاریخی همان روز محاسبه می‌شود.","مصوبه تأییدشده قابل ویرایش نیست؛ اصلاح فقط با مصوبه جدید یا ابطال سند مربوطه انجام می‌شود.","سررسید هر مصوبه را درست وارد کنید؛ سیستم نزدیک سررسید به عضو و مدیران هشدار می‌دهد."]},payments:{title:"پرداخت‌ها و وصول",about:"ثبت پرداخت‌های اعضا به شرکت (واریز به بانک، نقدی یا چک) و تخصیص آن‌ها به تعهدات مصوبه‌ها. عضو می‌تواند پرداخت خود را «اعلام» کند و مدیر مالی پس از بررسی وضعیت بانک آن را تأیید و وصول می‌کند.",steps:["عضو یا حسابدار با «اعلام پرداخت» مبلغ، تاریخ، روش و شماره پیگیری بانکی را ثبت می‌کند.","مدیر مالی پس از تطبیق با گردش بانک، پرداخت را «تأیید» می‌کند؛ سند حسابداری وصول به‌صورت خودکار صادر می‌شود.","تخصیص خودکار: مبلغ تأییدشده به‌صورت خودکار به تعهدات باز عضو (به ترتیب مصوبه‌های قدیمی‌تر) تهاتر می‌شود.","اگر تخصیص خودکار را خاموش کرده‌اید، از دکمه «تخصیص» هر ردیف، مبلغ را به تعهد دلخواه تخصیص دهید.","مبالغ تخصیص‌نیافته به‌عنوان «اعتبار عضو» در حساب جاری او می‌ماند و در تراز نهایی دیده می‌شود."],tips:["همیشه شماره پیگیری/فیش واریزی را ثبت کنید؛ مبنا و ملاک تأیید مالی همین است.","اعلام پرداخت هنوز «وصول» نیست؛ تا زمان تأیید مالی در پیشرفت تعهد محاسبه نمی‌شود.","برای پرداخت فوری و خودکار، از «کیف پول اعضا» و درگاه بانک ملی استفاده کنید؛ نتیجه مستقیم سرویس بانک جایگزین تأیید دستی می‌شود."]},wallet:{title:"کیف پول اعضا",about:"کیف پول، پیش‌پرداختِ عضو نزد شرکت است: عضو مبلغی شارژ می‌کند و هر وقت لازم شد، از موجودی آن تعهداتش را یک‌جا تسویه می‌کند یا مستقیم از کارتابل، هزینه/تعهد را آنلاین از درگاه بانک ملی پرداخت می‌کند. نتیجه پرداخت بانک «مستقیم به‌عنوان نتیجه سرویس» ثبت می‌شود و سند حسابداری خودکار صادر می‌گردد.",steps:["عضو: در کارتابل پرداختِ «وضعیت حساب من» یا صفحه «کیف پول من» دکمه «شارژ کیف پول» را بزنید؛ مبلغ و تاریخ را وارد کنید.","روش «درگاه بانک ملی»: به صفحه بانک منتقل می‌شوید، رمز پویا می‌گیرید و پرداخت می‌کنید؛ با شماره مرجع بانکی به سامانه برمی‌گردید و موجودی بلافاصله اعمال می‌شود.","روش «اعلام واریز دستی»: واریزتان به حساب شرکت را اعلام می‌کنید؛ مدیر مالی پس از تطبیق بانکی تأیید می‌کند.","دکمه «تسویه تعهدات از کیف پول»: موجودی به‌ترتیب مصوبه‌های قدیمی‌تر به تعهدات باز شما تخصیص می‌یابد.","در کارتابل، برای هر تعهد باز دکمه «پرداخت آنلاین» هست: پرداخت در بانک و تخصیص به همان تعهد بلافاصله انجام می‌شود."],tips:["شارژهای درگاهی خودکار تأیید می‌شوند (نتیجه بانک ملاک است)؛ فقط واریز دستی نیازمند تأیید مدیر مالی است.","شارژ کیف پول هزینه شرکت نیست؛ مطالبه عضو از شرکت ثبت می‌شود (بستانکار جاری عضو) و با هر استفاده از کیف پول، تعهد همان عضو تسویه می‌شود.","در نسخه پرتیبل جریان بانک شبیه‌سازی می‌شود تا آفلاین قابل تست باشد؛ در نسخه سرور، همین جریان به درگاه واقعی بانک ملی وصل می‌شود."]},services:{title:"خدمات اعضا و جبران خدمات",about:"عضوهایی که برای شرکت کار می‌کنند (مشاوره حقوقی، حسابداری، فنی، مدیریتی و...) در این بخش ثبت می‌شوند: تعداد × نرخ = مبلغ قابل جبران. پس از تأیید مدیرعامل، جبران یا «از محل اعتبار حساب عضو» انجام می‌شود (تهاتر با تعهدش) یا «نقداً» پرداخت می‌شود و هزینه شرکت ثبت می‌گردد.",steps:["دکمه «خدمت جدید»: عضو، تاریخ، نوع خدمت، عنوان، تعداد (ساعت/مورد) و نرخ را وارد کنید.","در «توضیح نحوه محاسبه» ملاک توافق (قرارداد یا صورتجلسه نرخ) را بنویسید تا مبلغ شفاف و قابل حسابرسی باشد.","خدمت را «ارسال برای تأیید» کنید؛ مدیرعامل پس از بررسی، روش جبران را انتخاب و تأیید می‌کند.","جبران «از محل اعتبار»: اعتبار به جاری عضو اضافه و با تعهدات او خودکار تهاتر می‌شود.","جبران «نقدی»: مبلغ از بانک/صندوق شرکت پرداخت و هزینه آن در حساب «خدمات اعضا و جبران خدمات» ثبت می‌شود."],tips:["مبلغ خدمت = تعداد × نرخ؛ اگر توافق مبلغ قطعی است، تعداد را ۱ و نرخ را کل مبلغ وارد کنید.","در پروفایل هر عضو، جمع خدمات و وضعیت جبران هر کدام قابل مشاهده است.","خدمت جبران‌شده سند قطعی دارد؛ اصلاح مبلغ فقط با سند ابطال/اصلاحی طبق فرآیند حسابداری ممکن است."]},members:{title:"اعضا و سهامداران",about:"دفتر اعضای شرکت: مشخصات، درصد سهام و تاریخچه تغییر آن، و پرونده مالی هر عضو (تعهدات، پرداخت‌ها، اعتبارها و خدمات). تغییر سهام با حفظ تاریخچه ثبت می‌شود تا محاسبات گذشته به هم نخورد.",steps:["با «عضو جدید» مشخصات کامل عضو (کد، نوع، شناسه ملی، تماس، حساب بانکی) را ثبت کنید.","دکمه «پرونده» هر ردیف، وضعیت حساب عضو را نشان می‌دهد: تعهدات مصوب، پرداخت‌ها و اعتبارها.","برای تغییر سهام، از پرونده عضو «افزودن تغییر سهام» را بزنید؛ درصد جدید از تاریخ مجاز شروع می‌شود.","برای دیدن پروفایل کامل مالی با تایم‌لاین، از دکمه «پروفایل کامل» یا بخش «پروفایل اشخاص» استفاده کنید."],tips:["درصد سهام مبنای تقسیم مصوبه‌های «متناسب با سهام» است؛ پس از هر مجمع، تغییر سهام را همان روز ثبت کنید.","عضو غیرفعال از محاسبات جدید حذف می‌شود ولی سوابق او حفظ می‌ماند."]},profiles:{title:"پروفایل اشخاص",about:"پروفایل مالی کامل هر شخص شرکت — سهامدار یا کارمند. یک نگاه: سهم فعلی، تعهدات، پرداخت‌ها، خدمات و جبران‌ها، اعتبارها و در انتها «تراز نهایی» یعنی دقیقاً چه کسی به چه کسی چقدر بدهکار است، به‌همراه تایم‌لاین همه رویدادها.",steps:["از فهرست اعضا، شخص مورد نظر را انتخاب کنید تا پروفایل کامل باز شود.","کارت «تراز نهایی و دستور تسویه» را بخوانید: پرداخت نقدی + اعتبار هزینه‌ای + اعتبار خدمات − مانده تعهد = تراز.","اگر تراز مثبت است شرکت به عضو بدهکار است (مبلغ تخصیص‌نیافته)؛ اگر منفی است عضو باید مابه‌التفاوت را بپردازد.","تب‌های تعهدات، پرداخت‌ها، خدمات و تایم‌لاین، ریز هر رویداد را نشان می‌دهند."],tips:["برای پروفایل کارکنان، کارت شخص در بخش «کارکنان شرکت» فعالیت و آخرین ورود را نشان می‌دهد.","عدد تراز نهایی همان عددی است که در جلسه تسویه دوره باید مبنا قرار گیرد."]},accounts:{title:"کدینگ حساب‌ها",about:"ساختار درختی کد حساب‌های حسابداری شرکت (کل، معین). حساب‌های هزینه و درآمد همین‌جا تعریف می‌شوند و در فرم هزینه‌ها و اسناد استفاده می‌شوند. حسابی که گردش دارد قابل حذف یا تغییر کد نیست.",steps:["برای حساب جدید، سطح را انتخاب کنید: حساب کل یا معین زیر یک کل.","کد را مطابق الگوی موجود وارد کنید (مثلاً 51043 زیر 5104) تا گزارش‌ها منسجم بمانند.","حساب غیرفعال‌شده در فرم‌های جدید پیشنهاد نمی‌شود ولی سوابقش باقی می‌ماند."],tips:["حساب «خدمات اعضا و جبران خدمات» (51042) مخصوص هزینه جبران خدمات اعضاست؛ آن را برای هزینه‌های عادی استفاده نکنید."]},vouchers:{title:"اسناد حسابداری",about:"دفتر اسناد دوطرفه سیستم: هر هزینه تأییدشده، وصول پرداخت، جبران خدمت و سند دستی اینجا ثبت می‌شود. اسناد خودکار منبع‌دار (هزینه/پرداخت/خدمت) با سند ابطال اصلاح می‌شوند نه با ویرایش.",steps:["با «سند دستی» رویدادهایی که در فرم‌های سامانه پوشش داده نمی‌شوند را ثبت کنید (بدهکار = بستانکار).","سند پیش‌نویس را با «قطعی‌سازی» نهایی کنید؛ پس از قطعی‌سازی فقط با سند ابطال (عکس سند) قابل اصلاح است.","دکمه «ابطال» سند قطعی، سند معکوس می‌سازد و دلیل آن را در توضیحات ثبت می‌کند."],tips:["شماره سند در پرونده هر هزینه/پرداخت/خدمت ذکر می‌شود؛ از همان‌جا ردپای کامل را دنبال کنید."]},reports:{title:"دفاتر و گزارش‌ها",about:"دفتر روزنامه، دفتر کل و معین، تفصیلی (جاری هر عضو)، تراز آزمایشی و گزارش تسویه اعضا. همه گزارش‌ها با فیلتر تاریخ کار می‌کنند و برای چاپ و ارائه به جلسه مناسب‌اند.",steps:["تب دلخواه را انتخاب و بازه تاریخ را بدهید؛ گزارش لحظه‌ای از اسناد قطعی ساخته می‌شود.","برای دیدن گردش یک عضو، از تب «تفصیلی» حساب جاری همان عضو را انتخاب کنید.","«گزارش تسویه اعضا» تراز نهایی همه سهامداران را یک‌جا می‌دهد — مستند اصلی جلسه تسویه.","با دکمه چاپ یا خروجی CSV، گزارش را برای بایگانی آماده کنید."],tips:["اعداد مبنا ریال است؛ واحد نمایش را از تنظیمات (تومان/ریال) تغییر دهید."]},statements:{title:"صورت‌های مالی",about:"صورت سود و زیان دوره و ترازنامه در لحظه، تولیدشده از اسناد قطعی. سود/زیان و ترکیب درآمد و هزینه‌ها و مانده حساب‌ها را برای تصمیم‌گیری و ارائه به مجمع نشان می‌دهد.",steps:["بازه دوره (یا تا امروز) را انتخاب کنید تا صورت‌ها بازمحاسبه شوند.","اختلاف دارایی با جمع بدهی و سرمایه + سود باید صفر باشد («کنترل توازن» در پایین صفحه)."],tips:["هزینه جبران خدمات اعضا جزو هزینه عملیاتی دوره است و در سود و زیان اثر می‌گذارد."]},analytics:{title:"تحلیل‌های هوشمند",about:"موارد غیرعادی را خودکار پیدا می‌کند: رشد ناگهانی هزینه، موارد مشکوک به ثبت تکراری، پیش‌بینی کسری نقدینگی و سررسیدهای نزدیک/گذشته. همه قواعد قطعی و شفاف‌اند و فرض هر قاعده زیر آن نوشته شده است.",steps:["هر کارت تحلیل را بخوانید؛ روی ارجاع‌ها (شماره هزینه، دفتر معین) کلیک/جست‌وجو کنید و به منبع بروید.","هیچ تحلیلی خودش سند نمی‌زند؛ تصمیم و اصلاح همیشه با فرآیند تأیید انسان انجام می‌شود."],tips:["اگر هیچ موردی نشان داده نمی‌شود یعنی همه قواعد در وضعیت مطلوب‌اند؛ به معنای نبود داده نیست."]},audit:{title:"ردپای حسابرسی",about:"لاگ کامل فعالیت‌ها: چه کسی، چه زمانی، چه اقدامی روی چه موضوعی انجام داده (ایجاد، تأیید، رد، ابطال، ورود و...). ابزار اصلی پاسخ‌گویی و ردگیری تغییرات است.",steps:["با فیلتر موضوع یا نام کاربری، ردپای یک ماجرا را دنبال کنید.","جزئیات هر اقدام (مبلغ‌ها و مقادیر قبل/بعد) در ستون توضیحات ذخیره شده است."],tips:["حذف یا ویرایش لاگ امکان‌پذیر نیست؛ این رفتار عمدی است تا اعتبار حسابرسی حفظ شود."]},users:{title:"مدیریت کاربران و سطح دسترسی",about:"درگاه ورود همه کاربران به سامانه: ساخت کاربر، اتصال کاربر عضو به پرونده عضو، تعیین نقش و کنترل دقیق اینکه هر نقش به کدام بخش‌ها دسترسی دارد (ماتریس سطح دسترسی). استفاده از سامانه فقط از این مسیر و با نقش مشخص انجام می‌شود.",steps:["با «کاربر جدید» برای هر شخص یک حساب بسازید: نام کاربری، رمز (حداقل ۶ نویسه) و نقش.","کاربر با نقش «عضو/سهامدار» باید به یک عضو متصل شود تا فقط پرتال خودش را ببیند و بتواند پرداخت اعلام کند.","در کارت «ماتریس سطح دسترسی» تیک هر بخش برای هر نقش را روشن/خاموش کنید و ذخیره کنید؛ منوی همه کاربران آن نقش همان لحظه تغییر می‌کند.","رمز هر کاربر را با «ویرایش» به‌روز کنید؛ کاربر خاطی را «غیرفعال» کنید (حذف نمی‌شود، سوابقش می‌ماند)."],tips:["اصل تفکیک وظایف: تأیید هزینه و مصوبه با مدیرعامل، تأیید وصول و اسناد با مدیر مالی، پیکربندی با مدیر سامانه.","ماتریس دسترسی جای نقش‌ها را عوض نمی‌کند؛ فقط «دیده‌شدن بخش‌ها» را کنترل می‌کند و عملیات حساس همچنان با نقش کنترل می‌شود.","برای امنیت بیشتر، هر کاربر می‌تواند از «تنظیمات» رمز دومرحله‌ای (PIN) فعال کند."]},settings:{title:"تنظیمات",about:"پیکربندی سامانه: نام شرکت، واحد نمایش مبالغ (تومان/ریال)، سال مالی، تهاتر خودکار اعتبار اعضا و بکاپ‌گیری/بازیابی کل دیتابیس. پروفایل کاربری و رمز دومرحله‌ای هم از همین‌جا مدیریت می‌شود.",steps:["اطلاعات شرکت و سال مالی را درست وارد کنید؛ سرصفحه همه گزارش‌ها از همین‌جا می‌آید.","«تهاتر خودکار» روشن باشد تا اعتبارهای عضو (پرداخت هزینه شخصی، خدمات) بلافاصله با تعهداتش تهاتر شوند.","به‌صورت منظم از «گرفتن پشتیبان» فایل JSON دانلود کنید و در محل امن نگه دارید.","بازیابی فقط در مواقع ضروری و با احتیاط انجام شود؛ کل داده با فایل پشتیبان جایگزین می‌شود."],tips:["بستن دوره مالی ثبت و ویرایش را برای غیرمدیران قفل می‌کند؛ فقط پایان سال مالی انجامش دهید."]},"my-account":{title:"وضعیت حساب من (پرتال عضو)",about:"پرتال اختصاصی عضو/سهامدار: سهم من از شرکت، تعهدات مصوب و مانده هر کدام، پرداخت‌های من، اعتبار بابت هزینه‌هایی که از جیب خودم پرداخت کرده‌ام، خدمات من و جبران آن‌ها و تراز نهایی حساب من.",steps:["کارت بالای صفحه، خلاصه وضعیت است؛ نوار پیشرفت نشان می‌دهد چه مقدار از تعهداتم تسویه شده.","برای اعلام پرداخت جدید از بخش «پرداخت‌ها و وصول» دکمه «اعلام پرداخت» را بزنید.","اگر هزینه‌ای برای شرکت از حساب شخصی من پرداخت کرده‌ام، پس از تأیید آن هزینه، اعتبارش اینجا ظاهر می‌شود.","هر ابهامی درباره یک عدد، با حسابرس یا
